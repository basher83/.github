[tools]
git-cliff = "2.14.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.changelog]
description = "Generate changelog from git commits"
run = "git-cliff -o CHANGELOG.md"

[tasks.ci]
description = "Lint workflows and validate the public inventory and generated overview"
run = [
  "actionlint .github/workflows/*.yml .github/use-workflows/*.yml .github/workflow-templates/*.yml",
  "python3 portfolio/inventory.py --check",
  "python3 -m unittest discover -s portfolio -p 'test_*.py'",
]
